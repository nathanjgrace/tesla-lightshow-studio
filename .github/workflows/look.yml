name: Competitor look
on: push
permissions:
  contents: write
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cp $GITHUB_WORKSPACE/look.mjs /tmp/pw/ && node look.mjs || true
      - name: Commit a summary
        if: always()
        run: |
          node summarize.mjs results
          cp /tmp/out/*.png results/ 2>/dev/null || true
          git config user.name "look-bot" && git config user.email "look-bot@users.noreply.github.com"
          git add results && git commit -m "Results" && git push
