name: Competitor look
on: push
permissions:
  contents: write
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node reviews.mjs
      - name: Commit results
        if: always()
        run: |
          git config user.name "look-bot" && git config user.email "look-bot@users.noreply.github.com"
          git add reviews && git commit -m "Reviews" && git push
