name: Competitor look
on: push
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cp $GITHUB_WORKSPACE/look.mjs /tmp/pw/ && node look.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: look, path: /tmp/out }
