# Temporary: checks how Apple's iTunes Search API (and Deezer's) answer
# browsers, since the development sandbox can't reach them. Results are
# committed back to this branch under diag/out/.
name: Diagnose song search
on:
  push:
    branches: ['diag/**']
    paths-ignore: ['diag/out/**']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe the APIs with curl
        run: |
          mkdir -p diag/out
          {
          for q in "one+more+time" "daft+punk" "bohemian+rhapsody"; do
            echo "=== Apple plain, Origin github.io: $q"
            curl -sS -m 20 -D - -o body.json -A "Mozilla/5.0 (Macintosh)" -H "Origin: https://nathanjgrace.github.io" "https://itunes.apple.com/search?term=$q&media=music&entity=song&limit=2" || echo "curl failed $?"
            head -c 400 body.json; echo
          done
          echo "=== Apple JSONP"
          curl -sS -m 20 -D - -A "Mozilla/5.0 (Macintosh)" "https://itunes.apple.com/search?term=one+more+time&media=music&entity=song&limit=1&callback=__cb1" | head -c 1800; echo
          echo "=== Apple plain, Origin example.com (is the CORS header cached across origins?)"
          curl -sS -m 20 -D - -o /dev/null -A "Mozilla/5.0 (Macintosh)" -H "Origin: https://example.com" "https://itunes.apple.com/search?term=one+more+time&media=music&entity=song&limit=2"
          echo "=== Deezer plain"
          curl -sS -m 20 -D - -A "Mozilla/5.0 (Macintosh)" -H "Origin: https://nathanjgrace.github.io" "https://api.deezer.com/search?q=one%20more%20time&limit=1" | head -c 1500; echo
          echo "=== Deezer JSONP"
          curl -sS -m 20 -D - -A "Mozilla/5.0 (Macintosh)" "https://api.deezer.com/search?q=one%20more%20time&limit=1&output=jsonp&callback=__cb2" | head -c 900; echo
          } > diag/out/curl.txt 2>&1
          curl -sS -m 20 -A "Mozilla/5.0 (Macintosh)" "https://api.deezer.com/search?q=one%20more%20time%20daft%20punk&limit=3" > diag/out/deezer.json
          curl -sS -m 20 -A "Mozilla/5.0 (Macintosh)" "https://api.deezer.com/search?q=one%20more%20time%20daft%20punk&limit=1&output=jsonp&callback=__cb2" > diag/out/deezer.jsonp.txt
          curl -sS -m 20 -D diag/out/deezer-preview-headers.txt -o /dev/null -r 0-1000 "$(python3 -c "import json;print(json.load(open('diag/out/deezer.json'))['data'][0]['preview'])")" || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright outside the project
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 >/dev/null 2>&1
          npx playwright install --with-deps chromium webkit >/dev/null 2>&1
      - name: Song search scenarios against a local build of this branch
        run: |
          npm ci
          npm run build
          (npx vite preview --port 4173 --strictPort > /dev/null 2>&1 &)
          sleep 3
          cp diag/scenarios.mjs /tmp/pw/
          node /tmp/pw/scenarios.mjs > diag/out/scenarios.txt 2>&1 || true
      - name: Commit results
        run: |
          git config user.name "diag-bot"
          git config user.email "diag-bot@users.noreply.github.com"
          git add diag/out
          git commit -m "Diagnostic results" || true
          git push
